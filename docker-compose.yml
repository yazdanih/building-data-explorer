services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: building-data-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BuildingDataExplorer#2026"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
